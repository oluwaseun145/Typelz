[package]
name = "app"
version = "0.1.0"
description = "Typelz - AI voice dictation"
authors = ["Typelz contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cpal = "0.15"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
base64 = "0.22"
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["blocking"] }
directories = "5"
ort = "2.0.0-rc.13"
ndarray = "0.15"
webrtc-vad = "0.4"
sha2 = "0.10"
keyring = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
